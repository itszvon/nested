name: Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run smoke checks against production
        run: node scripts/smoke.mjs
